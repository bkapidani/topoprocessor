[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "topoprocessor"
version = "0.2.0"
description = "Cohomology generators for tetrahedral and hexahedral 3D meshes"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "license.txt" }
authors = [{ name = "Bernard Kapidani" }]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
gmsh = ["gmsh>=4.11"]
netgen = ["netgen-mesher>=6.2"]
meshers = ["gmsh>=4.11", "netgen-mesher>=6.2"]

[tool.scikit-build]
cmake.source-dir = "src"
cmake.args = [
  "-DTOPOPROCESSOR_BUILD_PYTHON=ON",
  "-DTOPOPROCESSOR_BUILD_LEGACY_CLI=OFF",
  "-DBUILD_TESTING=OFF",
]
wheel.packages = ["python/topoprocessor"]

[tool.scikit-build.sdist]
include = ["docs/**", "tests/**"]
