name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-and-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install build dependencies
        run: python -m pip install --upgrade cmake ninja pybind11
      - name: Locate pybind11
        id: pybind11
        shell: bash
        run: echo "cmake_dir=$(python -m pybind11 --cmakedir)" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: >-
          cmake -S src -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTOPOPROCESSOR_BUILD_PYTHON=ON
          -Dpybind11_DIR="${{ steps.pybind11.outputs.cmake_dir }}"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import topoprocessor; print(topoprocessor.__name__)"

  current-mesher-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: python -m pip install ".[meshers]"
      - run: python tests/test_current_mesher_files.py
